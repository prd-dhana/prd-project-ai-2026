<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project AI 01</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <script src="details.js"></script>
        <section id="introduction" class="head-page">
            <div class="header-content">
                <h1 id="display-topic-title" class="topicName">กำลังโหลด...</h1>
                <p>โครงการศึกษาระบบ AI เพื่อการออกแบบ 2569</p>
            </div>
        </section>
    </header>
    <main>
        <section id="progress" class="main-frame">
            <div class="container">
                <div class="sub-box">
                    <div id="log-container">
                        
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="imageModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
            <div class="zoom-controls">
                <button onclick="zoom(0.5)">+</button>
                <button onclick="zoom(-0.5)">-</button>
                <button onclick="resetZoom()">Reset</button>
            </div>

            <div class="modal-content-wrapper" style="overflow: hidden;"> <button class="prev" onclick="changeImage(-1)">&#10094;</button>
                <div class="img-container">
                    <img id="modalImg" src="" draggable="false"> 
                </div>
                    <button class="next" onclick="changeImage(1)">&#10095;</button>
            </div>
        </div>
</body>
</html>
